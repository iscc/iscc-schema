title: Identifiers
type: object
description: Set of typed external identifiers served for an asset identified by an ISCC.
additionalProperties: true
required:
- identifier
examples:
- '@context': http://purl.org/iscc/context
  '@type': Identifiers
  $schema: http://purl.org/iscc/schema/identifiers.json
  iscc: ISCC:MAACAJINXFXA2SQX
  identifier:
  - scheme: iswc
    code: T-034.524.680-1
    scope: work
    primary: true
  - scheme: isrc
    code: USRC17607839
    scope: manifestation
properties:
  '@context':
    type: string
    format: uri
    const: http://purl.org/iscc/context
    description: The JSON-LD Context URI for ISCC metadata.
  '@type':
    type: string
    const: Identifiers
    description: The type of service metadata.
  $schema:
    type: string
    format: uri
    const: http://purl.org/iscc/schema/identifiers.json
    description: The JSON Schema URI for Identifiers service metadata.
  iscc:
    type: string
    description: An ISCC-CODE or ISCC-ID identifying the digital content these identifiers
      apply to. Mapped to JSON-LD @id when present; when omitted, the serving transport must
      preserve the asset subject out of band.
    example: ISCC:MAACAJINXFXA2SQX
    minLength: 15
    maxLength: 73
    pattern: ^ISCC:[A-Z2-7]{10,73}$
  identifier:
    type: array
    description: One or more typed external identifiers associated with the asset.
    minItems: 1
    x-iscc-context: http://schema.org/identifier
    x-iscc-status: draft
    items:
      type: object
      title: Identifier
      additionalProperties: true
      required:
      - scheme
      - code
      properties:
        scheme:
          type: string
          minLength: 1
          pattern: ^[a-z0-9]+([._-][a-z0-9]+)*$
          description: Lowercase token naming the identifier namespace, such as doi, isrc,
            iswc, isbn, issn, ror, or orcid.
          x-iscc-context: http://schema.org/propertyID
          x-iscc-status: draft
        code:
          type: string
          minLength: 1
          description: Identifier value within the declared scheme, normalized by the producer
            according to the scheme's conventions.
          x-iscc-context: http://schema.org/value
          x-iscc-status: draft
        scope:
          type: string
          pattern: ^[a-z0-9]+([._-][a-z0-9]+)*$
          description: Optional lowercase token naming the level the identifier applies to,
            such as work, series, manifestation, asset, organization, or person.
          x-iscc-context: http://purl.org/iscc/terms/#scope
          x-iscc-status: draft
        primary:
          type: boolean
          description: Preferred identifier flag within the same scope. True means preferred;
            false is equivalent to omission and is normalized away by the model construction
            path.
          x-iscc-context: http://purl.org/iscc/terms/#primary
          x-iscc-status: draft
